<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>

    --green1: #1a5c2a; --green2: #2e7d32;

    --red: #ea4335; --red-light: #fce8e6;
    --yellow-light: #fef9e3;

  }

  body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 60px; }

  header { background: linear-gradient(135deg, #1a5c2a 0%, #2e7d32 100%); color: #fff; padding: 32px 20px 40px; text-align: center; position: relative; overflow: hidden; }

  .escola-tag { display: inline-block; background: rgba(255,255,255,0.18); border: 1.5px solid rgba(255,255,255,0.30); border-radius: 30px; padding: 4px 18px; font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; }
  header h1 { font-family: 'Baloo 2', cursive; font-size: clamp(24px,5vw,38px); font-weight: 800; margin-bottom: 6px; text-shadow: 0 2px 8px rgba(0,0,0,0.18); }
  .header-meta { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 14px; }
  .meta-pill { background: rgba(255,255,255,0.20); border-radius: 20px; padding: 5px 14px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 5px; }

  .progress-wrap { position: sticky; top: 0; z-index: 100; background: #fff; border-bottom: 2px solid var(--border); padding: 10px 20px; display: flex; align-items: center; gap: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .progress-label { font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .progress-bar-bg { flex: 1; height: 10px; background: var(--border); border-radius: 10px; overflow: hidden; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, #1a5c2a, #2e7d32); border-radius: 10px; transition: width 0.4s ease; width: 0%; }
  .progress-count { font-size: 13px; font-weight: 800; color: var(--green1); white-space: nowrap; }

  main { max-width: 780px; margin: 0 auto; padding: 30px 16px; display: flex; flex-direction: column; gap: 20px; }

  .student-card { background: var(--card); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); border: 2px solid var(--green-light); }
  .student-card h2 { font-family: 'Baloo 2', cursive; font-size: 17px; color: var(--green1); margin-bottom: 14px; }
  .fields-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .field-group { flex: 1; min-width: 160px; }
  .field-group label { display: block; font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 5px; }
  .field-group input { width: 100%; border: 2px solid var(--border); border-radius: 10px; padding: 10px 14px; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 600; color: var(--text); outline: none; transition: border-color 0.2s; }
  .field-group input:focus { border-color: var(--green1); }

  /* QUESTION CARD */
  .q-card { background: var(--card); border-radius: var(--radius); padding: 24px 22px 20px; box-shadow: var(--shadow); border: 2px solid transparent; animation: slideIn 0.3s ease both; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .q-card.answered { border-color: #cbd5e1; background: #f8fafc; }
  .q-card.missing { border-color: var(--red) !important; background: #fff5f5 !important; animation: shake 0.4s ease; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }

  .q-header { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; }
  .q-num { background: linear-gradient(135deg, #1a5c2a, #2e7d32); color: #fff; font-family: 'Baloo 2', cursive; font-size: 16px; font-weight: 800; min-width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .q-text-wrap { flex: 1; }
  .q-text { font-size: 16px; font-weight: 700; line-height: 1.55; color: var(--text); }
  .q-points { margin-top: 4px; display: inline-block; background: var(--yellow-light); color: #92600a; font-size: 12px; font-weight: 800; border-radius: 20px; padding: 2px 10px; }

  /* OPTIONS */
  .options-list { display: flex; flex-direction: column; gap: 10px; }
  .opt { display: flex; align-items: center; gap: 14px; background: var(--bg); border: 2px solid var(--border); border-radius: 14px; padding: 13px 16px; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 700; color: var(--text); cursor: pointer; text-align: left; transition: all 0.18s; width: 100%; }
  .opt:hover:not(:disabled) { background: var(--green-light); border-color: var(--green1); transform: translateX(5px); }
  .opt.selected { background: var(--green-light); border-color: var(--green1); }
  .opt.confirmed-correct { background: #dcfce7; border-color: #16a34a; color: #14532d; }
  .opt.confirmed-wrong { background: var(--red-light); border-color: var(--red); color: #7f1d1d; }
  .opt.show-correct { background: #dcfce7; border-color: #16a34a; color: #14532d; }
  .opt:disabled { cursor: default; transform: none !important; }
  .opt-letter { width: 30px; height: 30px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; flex-shrink: 0; transition: background 0.18s; }
  .opt:hover:not(:disabled) .opt-letter { background: var(--green1); color: #fff; }
  .opt.selected .opt-letter { background: var(--green1); color: #fff; }
  .opt.confirmed-correct .opt-letter { background: #16a34a; color: #fff; }
  .opt.confirmed-wrong .opt-letter { background: var(--red); color: #fff; }
  .opt.show-correct .opt-letter { background: #16a34a; color: #fff; }

  .q-feedback { margin-top: 12px; padding: 10px 14px; border-radius: 10px; font-size: 14px; font-weight: 700; display: none; }
  .q-feedback.show { display: block; }
  .q-feedback.correct { background: #dcfce7; color: #14532d; }
  .q-feedback.wrong { background: var(--red-light); color: #7f1d1d; }
  .q-feedback.registered { background: #f1f5f9; color: #475569; }

  /* CONFIRM ROW */
  .confirm-row { margin-top: 12px; display: none; align-items: center; gap: 8px; flex-wrap: wrap; }
  .confirm-row.show { display: flex; }
  .btn-confirm { background: #16a34a; color: #fff; border: none; border-radius: 10px; padding: 9px 20px; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800; cursor: pointer; transition: opacity 0.18s; }
  .btn-confirm:hover { opacity: 0.88; }
  .btn-edit { background: transparent; color: var(--muted); border: 2px solid var(--border); border-radius: 10px; padding: 7px 16px; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; cursor: pointer; transition: all 0.18s; }

  .submit-btn { background: linear-gradient(135deg, #1a5c2a, #2e7d32); color: #fff; border: none; border-radius: 18px; padding: 16px 48px; font-family: 'Baloo 2', cursive; font-size: 20px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 20px rgba(26,92,42,0.35); transition: opacity 0.2s, transform 0.15s; }

  #toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1e293b; color: #fff; border-radius: 14px; padding: 14px 22px; font-size: 15px; font-weight: 700; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #result-screen { display: none; background: var(--card); border-radius: var(--radius); padding: 40px 30px; box-shadow: var(--shadow); text-align: center; animation: slideIn 0.5s ease; }
  .result-emoji { font-size: 64px; margin-bottom: 12px; }
  .result-title { font-family: 'Baloo 2', cursive; font-size: 30px; font-weight: 800; margin-bottom: 6px; }
  .result-name { font-size: 18px; font-weight: 700; color: var(--muted); margin-bottom: 20px; }
  .result-score { display: inline-block; font-family: 'Baloo 2', cursive; font-size: 56px; font-weight: 800; background: linear-gradient(135deg, #1a5c2a, #2e7d32); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px; }
  .result-max { font-size: 16px; color: var(--muted); font-weight: 700; margin-bottom: 24px; }
  .result-bar-bg { width: 100%; height: 18px; background: var(--border); border-radius: 18px; overflow: hidden; margin-bottom: 24px; }
  .result-bar { height: 100%; border-radius: 18px; background: linear-gradient(90deg, #1a5c2a, #2e7d32); transition: width 1s ease; }
  .result-msg { font-size: 17px; font-weight: 700; padding: 14px 20px; border-radius: 12px; margin-bottom: 20px; }
  .result-details { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px; }
  .detail-pill { border-radius: 20px; padding: 8px 18px; font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
  .detail-green { background: var(--green-light); color: var(--green1); }

  @media (max-width:500px) { .q-card { padding: 18px 14px 16px; } main { padding: 16px 10px; } }
</style>

  },

  {

    texto: 'A professora Sandra quis colocar o título no meio da página. Qual alinhamento ela deve usar?',
    correta: 'Centralizado',
    erradas: ['Justificado', 'Esquerda', 'Direita']
  },
  {
    id: 26,
    texto: 'A professora Cléssia quis desfazer uma ação que havia feito no Word. Qual atalho ela deve usar?',
    correta: 'Ctrl + Z',
    erradas: ['Ctrl + C', 'Ctrl + S', 'Ctrl + X']

// ── CONFIG ───────────────────────────────────────────────────────────────────
const TOTAL_Q     = 13;
const PTS_POR_Q   = parseFloat((10 / TOTAL_Q).toFixed(4));
const letras      = ['A', 'B', 'C', 'D'];

// ── STATE ────────────────────────────────────────────────────────────────────
const answered  = {};  // qIndex → { correct: bool, pts: number }
const selected  = {};  // qIndex → optIndex
let   provaQs   = [];  // questões sorteadas com alternativas embaralhadas

// ── UTILS ────────────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickRandom(arr, n) {
  return shuffle(arr).slice(0, n);
}

// ── TURMA / ANO ──────────────────────────────────────────────────────────────
const turma = (localStorage.getItem('aluno_turma') || '').toLowerCase();
const ano   = turma.startsWith('4') ? '4' : turma.startsWith('5') ? '5' : '4';
document.getElementById('anoLabel').textContent = ano + 'º Ano';
const PROVA_ID = `edutech-${ano}ano-t1`;

// ── GERAR PROVA ───────────────────────────────────────────────────────────────
function gerarProva() {
  const sorteadas = pickRandom(BANCO, TOTAL_Q);
  provaQs = sorteadas.map(q => {
    const opts = shuffle([q.correta, ...q.erradas]);
    return { ...q, opts, correctIndex: opts.indexOf(q.correta) };
  });
}

// ── RENDERIZAR ────────────────────────────────────────────────────────────────
function renderProva() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';

  provaQs.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `qcard-${qi}`;

    const optsHtml = q.opts.map((opt, oi) => `
      <button class="opt" id="opt-${qi}-${oi}" onclick="selectOpt(${qi},${oi})" data-qi="${qi}" data-oi="${oi}">
        <span class="opt-letter">${letras[oi]}</span>
        <span>${opt}</span>
      </button>
    `).join('');

    card.innerHTML = `
      <div class="q-header">
        <div class="q-num">${qi + 1}</div>
        <div class="q-text-wrap">
          <div class="q-text">${q.texto}</div>
          <span class="q-points">${PTS_POR_Q.toFixed(2).replace('.',',')} pt</span>
        </div>
      </div>
      <div class="options-list">${optsHtml}</div>
      <div class="confirm-row" id="confirm-row-${qi}">
        <button class="btn-confirm" onclick="confirmOpt(${qi})">✔ Confirmar resposta</button>
        <button class="btn-edit" onclick="editOpt(${qi})">✏️ Editar</button>
      </div>
      <div class="q-feedback" id="q-feedback-${qi}"></div>
    `;
    container.appendChild(card);
  });
}

// ── INTERAÇÃO ─────────────────────────────────────────────────────────────────
function selectOpt(qi, oi) {
  if (answered[qi] !== undefined) return;

  // Desmarcar anterior
  if (selected[qi] !== undefined) {
    document.getElementById(`opt-${qi}-${selected[qi]}`).classList.remove('selected');
  }
  selected[qi] = oi;
  document.getElementById(`opt-${qi}-${oi}`).classList.add('selected');

  // Mostrar confirm row
  document.getElementById(`confirm-row-${qi}`).classList.add('show');
}

function editOpt(qi) {
  if (answered[qi] !== undefined) return;
  // Desmarcar
  if (selected[qi] !== undefined) {
    document.getElementById(`opt-${qi}-${selected[qi]}`).classList.remove('selected');
    delete selected[qi];
  }
  document.getElementById(`confirm-row-${qi}`).classList.remove('show');
}

function confirmOpt(qi) {
  if (answered[qi] !== undefined) return;
  if (selected[qi] === undefined) { showToast('⚠️ Selecione uma alternativa!'); return; }

  const q        = provaQs[qi];
  const oi       = selected[qi];
  const isCorrect = oi === q.correctIndex;
  const pts      = isCorrect ? PTS_POR_Q : 0;

  answered[qi] = { correct: isCorrect, pts };
  updateProgress();

  // Lock all options
  q.opts.forEach((_, i) => {
    const btn = document.getElementById(`opt-${qi}-${i}`);
    btn.disabled = true;
    if (i === oi && isCorrect)  btn.className = 'opt confirmed-correct';
    if (i === oi && !isCorrect) btn.className = 'opt confirmed-wrong';
    if (i === q.correctIndex && !isCorrect) btn.className = 'opt show-correct';
  });

  // Hide confirm row
  document.getElementById(`confirm-row-${qi}`).classList.remove('show');

  // Feedback
  const fb = document.getElementById(`q-feedback-${qi}`);
  fb.classList.add('show');
  if (isCorrect) {
    fb.className = 'q-feedback show correct';
    fb.textContent = '✅ Resposta correta!';
  } else {
    fb.className = 'q-feedback show wrong';
    fb.textContent = `❌ Incorreto! A resposta certa é: ${q.correta}`;
  }

  document.getElementById(`qcard-${qi}`).classList.add('answered');
}

// ── PROGRESS ──────────────────────────────────────────────────────────────────
function updateProgress() {
  const n = Object.keys(answered).length;
  document.getElementById('progressBar').style.width = (n / TOTAL_Q * 100) + '%';
  document.getElementById('progressCount').textContent = n + ' / ' + TOTAL_Q;
}

// ── TOAST ─────────────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.innerHTML = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

// ── SUBMIT ────────────────────────────────────────────────────────────────────
const API_URL    = localStorage.getItem('api_url') || 'https://escola-mundai-backend-production.up.railway.app';
const alunoToken = localStorage.getItem('token');
const alunoNome  = localStorage.getItem('aluno_nome') || '';

if (!alunoToken) window.location.replace('login.html');
if (alunoNome) {
  const ni = document.getElementById('studentName');
  if (ni) { ni.value = alunoNome; ni.readOnly = true; ni.style.background = '#f1f5f9'; }
}

async function submitProva() {
  // Confirm any selected but not confirmed
  provaQs.forEach((_, qi) => {
    if (answered[qi] === undefined && selected[qi] !== undefined) confirmOpt(qi);
  });

  // Check missing
  const missing = provaQs.map((_, qi) => qi).filter(qi => answered[qi] === undefined);
  document.querySelectorAll('.q-card').forEach(c => c.classList.remove('missing'));
  if (missing.length > 0) {
    missing.forEach(qi => document.getElementById(`qcard-${qi}`).classList.add('missing'));
    document.getElementById(`qcard-${missing[0]}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
    showToast('⚠️ Responda todas as questões antes de finalizar!');
    return;
  }

  const totalPts = parseFloat(Math.min(
    Object.values(answered).reduce((a, b) => a + b.pts, 0), 10
  ).toFixed(1));
  const pct = Math.round((totalPts / 10) * 100);

  const submitBtn = document.querySelector('.submit-btn');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = '📤 Enviando…'; }

  // Build respostas
  const respostas = {};
  provaQs.forEach((q, qi) => {
    respostas[`q${qi + 1}_id${q.id}`] = {
      questao: q.texto.substring(0, 60) + '…',
      respondeu: q.opts[selected[qi]],
      correta: q.correta,
      acertou: answered[qi].correct
    };
  });

  try {
    const res = await fetch(`${API_URL}/api/prova/${PROVA_ID}/enviar`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${alunoToken}` },
      body: JSON.stringify({ respostas, nota: totalPts })
    });
    if (res.status === 401) { window.location.replace('login.html'); return; }
  } catch (e) { console.warn(e); }

  // Show result
  document.querySelector('.submit-section').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.style.display = 'block';
  rs.scrollIntoView({ behavior: 'smooth', block: 'center' });

  document.getElementById('result-name').textContent  = alunoNome || document.getElementById('studentName')?.value || 'Aluno(a)';
  document.getElementById('result-score').textContent = totalPts.toFixed(1).replace('.', ',');
  setTimeout(() => { document.getElementById('result-bar').style.width = pct + '%'; }, 300);

  const correctCount = Object.values(answered).filter(a => a.correct).length;
  let emoji, title, msg, stars;
  if      (pct >= 90) { emoji='🏆'; title='Excelente!';         stars='⭐⭐⭐⭐⭐'; msg='Incrível! Você dominou o conteúdo! Continue assim!'; }
  else if (pct >= 70) { emoji='🎉'; title='Muito Bem!';         stars='⭐⭐⭐⭐';  msg='Ótima pontuação! Você está aprendendo muito bem!'; }
  else if (pct >= 50) { emoji='👍'; title='Bom trabalho!';      stars='⭐⭐⭐';   msg='Revise o conteúdo para melhorar ainda mais.'; }
  else                { emoji='📖'; title='Continue estudando!'; stars='⭐⭐';    msg='Não desanime! Revise o material e tente de novo.'; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-stars').textContent = stars;
  document.getElementById('result-msg').textContent   = msg;
  document.getElementById('result-msg').className = 'result-msg ' + (pct >= 70 ? 'detail-green' : 'detail-red');
  document.getElementById('result-details').innerHTML = `
    <div class="detail-pill detail-green">✅ ${correctCount} corretas</div>
    <div class="detail-pill detail-red">❌ ${TOTAL_Q - correctCount} erradas</div>
    <div class="detail-pill detail-green">📋 ${TOTAL_Q} respondidas</div>
    <div style="margin-top:16px;width:100%">
      <a href="home.html" style="display:inline-block;background:#1a5c2a;color:#fff;border-radius:12px;padding:12px 28px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;text-decoration:none;">← Voltar para início</a>
    </div>`;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
document.getElementById('studentDate').valueAsDate = new Date();
gerarProva();
renderProva();
updateProgress();
</script>
</body>
