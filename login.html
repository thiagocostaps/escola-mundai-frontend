<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escola Mundaí – Entrar</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1a73e8; --blue-light: #e8f0fe;
    --green: #34a853; --red: #ea4335;
    --bg: #f0f4ff; --card: #fff;
    --text: #1e293b; --muted: #64748b;
    --border: #e2e8f0; --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #1a73e8 0%, #7c3aed 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .login-box {
    background: #fff;
    border-radius: 24px;
    padding: 40px 36px;
    width: 100%; max-width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    text-align: center;
  }
  .escola-logo { font-size: 48px; margin-bottom: 8px; }
  .escola-nome {
    font-family: 'Baloo 2', cursive;
    font-size: 26px; font-weight: 800;
    color: var(--text); margin-bottom: 4px;
  }
  .escola-sub { font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 32px; }

  .field { text-align: left; margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .field input {
    width: 100%; border: 2px solid var(--border); border-radius: 12px;
    padding: 13px 16px; font-family: 'Nunito', sans-serif;
    font-size: 15px; font-weight: 600; color: var(--text); outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus { border-color: var(--blue); }

  .btn-login {
    width: 100%; background: linear-gradient(135deg, #1a73e8, #7c3aed);
    color: #fff; border: none; border-radius: 14px;
    padding: 14px; font-family: 'Baloo 2', cursive;
    font-size: 18px; font-weight: 800; cursor: pointer;
    margin-top: 8px; transition: opacity 0.2s, transform 0.15s;
    box-shadow: 0 4px 16px rgba(26,115,232,0.35);
  }
  .btn-login:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-login:disabled { opacity: 0.6; cursor: default; transform: none; }

  .erro {
    background: #fce8e6; color: #991b1b; border-radius: 10px;
    padding: 10px 14px; font-size: 14px; font-weight: 700;
    margin-top: 14px; display: none;
  }
  .admin-link {
    display: block; margin-top: 20px; font-size: 13px;
    color: var(--muted); font-weight: 600;
    text-decoration: none; transition: color 0.2s;
  }
  .admin-link:hover { color: var(--blue); }
</style>
</head>
<body>
<div class="login-box">
  <div class="escola-logo">🏫</div>
  <div class="escola-nome">Escola Mundaí</div>
  <div class="escola-sub">Sistema de Avaliações Online</div>

  <div class="field">
    <label>Usuário</label>
    <input type="text" id="usuario" placeholder="Digite seu usuário…" autocomplete="username">
  </div>
  <div class="field">
    <label>Senha</label>
    <input type="password" id="senha" placeholder="Digite sua senha…" autocomplete="current-password">
  </div>

  <button class="btn-login" id="btnLogin" onclick="fazerLogin()">🔐 Entrar</button>
  <div class="erro" id="erro"></div>
  <a href="admin.html" class="admin-link">⚙️ Acesso Administrador</a>
</div>

<script>
  const API = window.location.hostname === 'localhost'
    ? 'http://localhost:3000'
    : 'https://escola-mundai-backend-production.up.railway.app'; // ← trocar após deploy

  document.getElementById('senha').addEventListener('keydown', e => {
    if (e.key === 'Enter') fazerLogin();
  });

  async function fazerLogin() {
    const usuario = document.getElementById('usuario').value.trim();
    const senha   = document.getElementById('senha').value;
    const btn     = document.getElementById('btnLogin');
    const erroEl  = document.getElementById('erro');

    erroEl.style.display = 'none';
    if (!usuario || !senha) { mostrarErro('Preencha usuário e senha.'); return; }

    btn.disabled = true;
    btn.textContent = 'Entrando…';

    try {
      const res = await fetch(`${API}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, senha })
      });
      const data = await res.json();
      if (!res.ok) { mostrarErro(data.erro || 'Erro ao entrar.'); return; }

      localStorage.setItem('token', data.token);
      localStorage.setItem('aluno_nome', data.nome);
      localStorage.setItem('aluno_turma', data.turma || '');
      localStorage.setItem('api_url', API);
      window.location.href = 'home.html';
    } catch {
      mostrarErro('Erro de conexão. Tente novamente.');
    } finally {
      btn.disabled = false;
      btn.textContent = '🔐 Entrar';
    }
  }

  function mostrarErro(msg) {
    const el = document.getElementById('erro');
    el.textContent = msg;
    el.style.display = 'block';
  }

  // Se já logado, vai direto pra home
  if (localStorage.getItem('token')) window.location.href = 'home.html';
</script>
</body>
</html>
